<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur de chasse</title>
<style>
:root { --bg: #f6f4ef; --card: #fff; --ink: #1d1b16; --muted: #6b665c; --line: #e2ddd2; --accent: #2f6f4f; --warn: #b4441f; --pick: #e9f3ec; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16150f; --card: #211f18; --ink: #ece8de; --muted: #a39d8f; --line: #3a362b; --accent: #7cc39b; --warn: #f08a62; --pick: #22382b; } }
:root[data-theme="dark"] { --bg: #16150f; --card: #211f18; --ink: #ece8de; --muted: #a39d8f; --line: #3a362b; --accent: #7cc39b; --warn: #f08a62; --pick: #22382b; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
textarea { min-height: 64px; resize: vertical; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.row { display: grid; gap: 10px; }
.c1 { grid-template-columns: 1fr; }
.c2 { grid-template-columns: 1fr 1fr; }
.c3 { grid-template-columns: 1fr 1fr 1fr; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin: 20px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); }
h2[style] { border-top: 0; padding-top: 0; }
button { margin-top: 14px; padding: 10px 18px; border: 0; border-radius: 6px; background: var(--accent); color: var(--bg); font: 600 15px system-ui, sans-serif; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 5px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
th:first-child, td:first-child { text-align: left; }
tr.zero td { color: var(--muted); }
.scroll { overflow-x: auto; }
.err { color: var(--warn); font-weight: 600; }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>🐜 Simulateur de chasse</h1>
  <p class="sub">Risque de grosse riposte et pertes selon la taille de la chasse (modèle Bidouillezzz, calé sur de vraies chasses).</p>

  <form class="card" id="f">
    <h2 style="margin-top:0">Armée</h2>
    <label for="paste">Coller l’armée du jeu (facultatif)</label>
    <textarea id="paste" placeholder="ex. Troupes en chasses : 3 244 Jeunes Soldates Naines, 699 Soldates Naines, 86 Naines d'Elites, 1 273 Jeunes Soldates, 68 Soldates"></textarea>
    <div class="hint">Remplit les cases ci-dessous ; tu peux aussi les remplir à la main.</div>
    <div class="grid" id="units" style="margin-top:12px"></div>
    <h2>Terrain</h2>
    <div class="row c1"><div><label for="tdc">Terrain à l’arrivée de la chasse (cm²)</label><input id="tdc" inputmode="numeric" required></div></div>
    <h2>Niveaux</h2>
    <div class="row c3">
      <div><label for="weapons">Armes</label><input id="weapons" inputmode="numeric" value="0"></div>
      <div><label for="shield">Bouclier</label><input id="shield" inputmode="numeric" value="0"></div>
      <div><label for="huntSpeed" title="Vitesse de chasse">VC</label><input id="huntSpeed" inputmode="numeric" value="0"></div>
    </div>
    <h2>Risque de grosse riposte</h2>
    <div class="row c2">
      <div><label for="min">Min (%)</label><input id="min" inputmode="numeric" value="15"></div>
      <div><label for="max">Max (%)</label><input id="max" inputmode="numeric" value="30"></div>
    </div>
    <button id="go" type="submit">Simuler</button>
  </form>

  <div class="card" id="out" hidden></div>
</main>
<script>
const API = 'https://ingizjfdafwpayvrxvwq.supabase.co/functions/v1/simu-chasse';
const UNITS = [
  ['JSN', /jeunes? soldates? naines?/], ['SN', /soldates? naines?/], ['NE', /naines? d.?[ée]lites?/],
  ['JS', /jeunes? soldates?/], ['SE', /soldates? d.?[ée]lites?/], ['S', /soldates?/],
  ['CE', /concierges? d.?[ée]lites?/], ['C', /concierges?/], ['AE', /artilleuses? d.?[ée]lites?/], ['A', /artilleuses?/],
  ['TkE', /tanks? d.?[ée]lites?/], ['Tk', /tanks?/], ['TuE', /tueuses? d.?[ée]lites?/], ['Tu', /tueuses?/],
];
const ORDER = ['JSN', 'SN', 'NE', 'JS', 'S', 'SE', 'C', 'CE', 'A', 'AE', 'Tk', 'TkE', 'Tu', 'TuE'];
const $ = (id) => document.getElementById(id);
const num = (s) => Number(String(s ?? '').replace(/[\s  .]/g, '').replace(',', '.')) || 0;
const fmt = (n) => Math.round(n).toLocaleString('fr-FR');
const dur = (s) => { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return `${h}h${String(m).padStart(2, '0')}`; };

for (const k of ORDER) $('units').insertAdjacentHTML('beforeend', `<div><label for="u-${k}">${k}</label><input id="u-${k}" inputmode="numeric" placeholder="0"></div>`);

// « 3 244 Jeunes Soldates Naines, 699 Soldates Naines… » → cases
$('paste').addEventListener('input', () => {
  const txt = $('paste').value.toLowerCase().replace(/[  ]/g, ' ');
  const found = {};
  for (const m of txt.matchAll(/(\d[\d ]*)\s+([a-zéèêàçô' ’]+?)(?=[,;.\n]|$|\s\d)/g)) {
    const name = m[2].trim();
    const hit = UNITS.find(([, re]) => new RegExp(`^${re.source}$`).test(name));
    if (hit) found[hit[0]] = (found[hit[0]] || 0) + num(m[1]);
  }
  if (Object.keys(found).length) for (const k of ORDER) $(`u-${k}`).value = found[k] ? fmt(found[k]) : '';
});

// réglages gardés sur cet appareil
const FIELDS = ['tdc', 'weapons', 'shield', 'huntSpeed', 'min', 'max', ...ORDER.map((k) => `u-${k}`)];
try { const s = JSON.parse(localStorage.getItem('simu') || '{}'); for (const f of FIELDS) if (s[f] != null) $(f).value = s[f]; } catch { /* rien */ }

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  try { localStorage.setItem('simu', JSON.stringify(Object.fromEntries(FIELDS.map((f) => [f, $(f).value])))); } catch { /* rien */ }
  const army = Object.fromEntries(ORDER.map((k) => [k, num($(`u-${k}`).value)]).filter(([, n]) => n > 0));
  const body = { tdc: num($('tdc').value), army, weapons: num($('weapons').value), shield: num($('shield').value), huntSpeed: num($('huntSpeed').value), min: num($('min').value), max: num($('max').value) };
  const out = $('out');
  out.hidden = false;
  out.innerHTML = '<p class="note">Calcul…</p>';
  $('go').disabled = true;
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const r = await res.json();
    if (r.error) { out.innerHTML = `<p class="err">${r.error}</p>`; return; }
    const line = (x, cls = '') => `<tr class="${cls}"><td>${fmt(x.taille)}</td><td>${x.risque.toLocaleString('fr-FR')} %</td><td>${fmt(x.pertes)}</td><td>${fmt(x.pertesGrosse)}</td><td>${fmt(x.pertesMoy)}</td><td>${dur(x.duree)}</td></tr>`;
    const rows = [r.sansRisque && line(r.sansRisque, 'zero'), ...r.rows.map((x) => line(x))].filter(Boolean).join('');
    const text = ['Taille | Risque | Pertes hab. | Pertes grosse riposte | Pertes moy. | Durée', ...[r.sansRisque, ...r.rows].filter(Boolean).map((x) => `${x.taille} | ${x.risque} % | ${x.pertes} | ${x.pertesGrosse} | ${x.pertesMoy} | ${dur(x.duree)}`)].join('\n');
    out.innerHTML = `<div class="scroll"><table><thead><tr><th>Taille</th><th>Risque</th><th>Pertes</th><th>Grosse rip.</th><th>Moy.</th><th>Durée</th></tr></thead><tbody>${rows || '<tr><td colspan="6">Aucune taille dans cette plage de risque.</td></tr>'}</tbody></table></div>
      <button type="button" id="copy">Copier le tableau</button>
      <p class="note">Taille en cm². Pertes : chasse habituelle / en grosse riposte / moyenne, en unités les plus faibles (elles meurent en premier), blessée comprise. Ligne grisée : la plus grosse chasse sans risque de grosse riposte. Plus grosse chasse gagnée : ${fmt(r.plusGrosse.taille)} cm² (${r.plusGrosse.risque} % de risque).</p>`;
    $('copy').onclick = () => navigator.clipboard?.writeText(text).then(() => { $('copy').textContent = 'Copié ✓'; });
  } catch (err) {
    out.innerHTML = `<p class="err">Serveur injoignable (${err.message}).</p>`;
  } finally { $('go').disabled = false; }
});
</script>
</body>
</html>
